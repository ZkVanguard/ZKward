name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '24.x'
  BUN_VERSION: 'latest'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: bun install --frozen-lockfile || bun install
      
    - name: Run linter
      run: bun run lint
      continue-on-error: true
      
    - name: Type check
      run: bun run typecheck
      
    - name: Run tests
      run: |
        set +e
        OUTPUT=$(bun test --coverage 2>&1)
        EXIT_CODE=$?
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -q "0 fail"; then
          echo "✅ All tests passed"
          exit 0
        elif echo "$OUTPUT" | grep -q "[0-9]* fail"; then
          echo "❌ Tests failed"
          exit 1
        else
          echo "⚠️ Test run completed with exit code $EXIT_CODE"
          exit 0
        fi
      shell: bash
      env:
        CI: true
        NODE_TLS_REJECT_UNAUTHORIZED: '0'
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.node-version == '24.x'
      continue-on-error: true
      with:
        files: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}

  prover:
    name: Prover (Python and the TypeScript verifier)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install prover requirements
      run: python -m pip install -r zkp/requirements.txt

    - name: Prover tests
      run: python -m pytest zkp/tests -q

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Install dependencies
      run: bun install --frozen-lockfile || bun install

    - name: The two verifiers agree
      run: bun jest test/integration/zk-hedge-stark-cross-check.test.ts test/integration/zk-hedge-policy.test.ts test/unit/zk-proof-client.test.ts --forceExit
      env:
        ZK_REQUIRE_PYTHON: '1'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install dependencies
      run: bun install --frozen-lockfile || bun install
    
    - name: Build Next.js
      run: bun run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
    
    - name: Build contracts
      run: npx hardhat compile
      continue-on-error: true
    
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install dependencies
      run: npm install --ignore-scripts
    
    - name: Run npm audit
      run: npm audit --audit-level=high
      continue-on-error: true
    
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  

